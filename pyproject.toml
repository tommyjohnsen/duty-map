[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duty-map"
version = "0.1.0"
description = "Evaluate duties expressed as defeasible rules"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = []

[project.scripts]
duty-map = "duty_map.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
